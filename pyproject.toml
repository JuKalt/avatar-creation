[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-creation"
version = "0.1.0"
description = "Avatar method orchestration and adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["multiview-data>=0.1,<0.2", "numpy>=1.24,<3", "Pillow>=10,<13", "PyYAML>=6,<7"]

[project.optional-dependencies]
ui = ["textual>=0.80,<9"]
test = ["torch>=2.5,<3", "scipy>=1.10,<2", "opencv-python-headless>=4.8,<5", "h5py>=3,<4", "torchvision>=0.20,<1", "torchmetrics>=1.5,<2", "gsplat>=1.4,<2", "textual>=0.80,<9"]

[project.scripts]
avatar-create = "avatar_creation.methods.cli:main"

[tool.setuptools.packages.find]
include = ["avatar_creation*"]

[tool.setuptools.package-data]
"avatar_creation.methods" = ["methods.json"]
